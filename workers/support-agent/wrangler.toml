name = "nmv-support-agent"
account_id = "70d82e3d9583b87fc0de2cf70076f272"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# D1 database for sessions + the human-review escalation queue.
# Create with:  wrangler d1 create nmv-support-agent-db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "nmv-support-agent-db"
database_id = "125ff2c8-bf47-46a8-9a82-827f6b105ee4"

# Workers AI binding — the primary model transport (no external key).
[ai]
binding = "AI"

[vars]
# Optional overrides (defaults are safe):
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# ALLOWED_ORIGINS = "https://nmvbible.org,https://www.nmvbible.org,https://c2r-marketing.github.io"

# Secrets (NEVER in this file — set via the Cloudflare API / wrangler secret put):
#   CEREBRAS_API_KEY — fallback LLM provider (OpenAI-compatible)
#   GEMINI_API_KEY   — fallback LLM provider (OpenAI-compatible)
#   ADMIN_USER       — basic-auth username for /admin
#   ADMIN_PASS       — basic-auth password for /admin
